version: '3.8'

services:
  postgres:
    image: postgres:15-alpine  # Будет скачан автоматически
    container_name: myaggrybot_postgres
    environment:
      POSTGRES_DB: myaggrybot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Логирование медленных запросов (>200ms)
      POSTGRES_LOG_MIN_DURATION_STATEMENT: "200"
      # Включение pg_stat_statements
      POSTGRES_SHARED_PRELOAD_LIBRARIES: "pg_stat_statements"
    command: >
      postgres
      -c log_min_duration_statement=200
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - myaggrybot_network

  redis:
    image: redis:7-alpine  # Будет скачан автоматически
    container_name: myaggrybot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - myaggrybot_network

  redis-commander:
    image: rediscommander/redis-commander:latest  # Будет скачан автоматически
    container_name: myaggrybot_redis_commander
    environment:
      - REDIS_HOSTS=local:myaggrybot_redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - myaggrybot_network

volumes:
  postgres_data:
  redis_data:

networks:
  myaggrybot_network:
    driver: bridge